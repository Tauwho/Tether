<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1500px;height:1000px;overflow:hidden}
body{background:linear-gradient(135deg,#0c66e4 0%,#1d3f8f 60%,#1c2b41 100%);font-family:"Segoe UI",system-ui,sans-serif;color:#fff;position:relative}
.l{position:absolute;left:90px;top:120px;width:600px}
.mark{width:120px;height:120px}
h1{font-size:120px;font-weight:700;margin:24px 0 8px;letter-spacing:-2px}
p{font-size:40px;line-height:1.3;margin:0;color:#e6efff}
.chips{margin-top:44px;display:flex;flex-wrap:wrap;gap:14px}
.chips span{font-size:24px;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.shot{position:absolute;right:-40px;top:220px;width:780px;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45);transform:rotate(-2deg);border:6px solid #fff}
.foot{position:absolute;left:90px;bottom:60px;font-size:24px;color:#b9cdf2}
</style></head><body>
<div class="l">

<h1>Tether</h1>
<p>Catch Jira tickets that contradict your team's Confluence decisions, with quotes as evidence.</p>
<div class="chips"><span>Jira panel</span><span>Rovo agent</span><span>MCP</span><span>Teamwork Graph</span><span>Forge LLMs</span></div>
</div>
<img class="shot" src="panel.png">
<div class="foot">Codegeist 2026 · Apps for Software Teams · Runs on Atlassian</div>
</body></html>
